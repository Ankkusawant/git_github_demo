  <script>

    async function loadProjectData() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error(`Fetch returned ${res.status}`);
        const data = await res.json();
        const list = Array.isArray(data) ? data : data.projects;
        if (!Array.isArray(list) || !list.length) throw new Error("Empty data file");
        // Normalize to this page's field names (name vs projectName)
        projectData = list
          .filter(p => p && String(p.status || "").toLowerCase() === "active")
          .map(p => ({
            id: p.id,
            name: p.projectName || p.name,
            type: p.type,
            description: p.description,
            status: p.status,
            date: p.date,
            link: p.link,
            impact: p.impact,
            images: Array.isArray(p.images) ? p.images
                  : Array.isArray(p.media) ? p.media.filter(m => m.type !== "video").map(m => m.url)
                  : []
          }));
      } catch (err) {
        console.warn("portfolio.html: falling back to sample data —", err.message);
        projectData = SAMPLE_PROJECTS;
      }
      renderProjects('all');
    }


    // ================================================================
    // 3.  SLIDER CONTROLLER
    // ================================================================
    function initSlider(card) {
      const track = card.querySelector('.slider-track');
      const dots = card.querySelectorAll('.dot');
      const prev = card.querySelector('.slider-prev');
      const next = card.querySelector('.slider-next');
      const total = track ? track.children.length : 1;
      let current = 0;
      let interval = null;
      const AUTOPLAY = 3800;

      function goTo(index) {
        if (index < 0) index = total - 1;
        if (index >= total) index = 0;
        current = index;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('active', i === current));
      }

      function nextSlide() { goTo(current + 1); }
      function prevSlide() { goTo(current - 1); }

      function startAuto() {
        stopAuto();
        if (total <= 1) return;
        interval = setInterval(nextSlide, AUTOPLAY);
      }
      function stopAuto() {
        if (interval) { clearInterval(interval); interval = null; }
      }

      if (prev) prev.addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); startAuto(); });
      if (next) next.addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); startAuto(); });
      dots.forEach(d => {
        d.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(d.dataset.index, 10);
          if (!isNaN(idx)) { goTo(idx); startAuto(); }
        });
      });

      card.addEventListener('mouseenter', stopAuto);
      card.addEventListener('mouseleave', startAuto);

      let startX = 0, dragging = false;
      card.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        dragging = true;
        stopAuto();
      }, { passive: true });
      card.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        if (Math.abs(dx) > 30) {
          e.preventDefault();
          if (dx > 0) prevSlide(); else nextSlide();
          dragging = false;
          startAuto();
        }
      }, { passive: false });
      card.addEventListener('touchend', () => { dragging = false; startAuto(); }, { passive: true });

      if (total > 1) startAuto();
    }


    // ================================================================
    // 4.  RENDER + INFINITE LOOP
    // ================================================================
    let allCards = [];
    let currentFilter = 'all';
    let setWidth = 0;
    let totalCards = 0;

    function renderProjects(filter = 'all') {
      currentFilter = filter;
      const track = document.getElementById('horizontalTrack');
      const filtered = filter === 'all' ? projectData : projectData.filter(p => p.type === filter);

      if (filtered.length === 0) {
        track.innerHTML =
          `<div style="color:#94a3b8; font-size:1.2rem; padding:40px; text-align:center; width:100%;">No projects match this filter.</div>`;
        allCards = [];
        updateStats();
        return;
      }

      let singleSetHtml = '';
      filtered.forEach((p, idx) => {
        const isWeb = p.type === 'web';
        const badgeClass = isWeb ? '' : 'auto';
        const typeLabel = isWeb ? 'Web' : 'Automation';
        const typeTag = isWeb ? 'type-web' : 'type-auto';

        const images = p.images || [];
        let slidesHtml = '';
        if (images.length === 0) {
          slidesHtml =
            `<div class="slide"><div style="color:rgba(255,255,255,0.15);font-size:14px;">No image</div></div>`;
        } else {
          images.forEach((url, i) => {
            slidesHtml += `
                <div class="slide" data-index="${i}">
                  <img src="${url}" alt="${p.name} — ${i+1}" loading="lazy" />
                </div>
              `;
          });
        }

        const totalSlides = images.length;
        const dotsHtml = Array.from({ length: totalSlides }, (_, i) =>
          `<button class="dot ${i===0?'active':''}" data-index="${i}" aria-label="Slide ${i+1}"></button>`
        ).join('');

        singleSetHtml += `
            <div class="project-card visible" data-type="${p.type}" data-index="${idx}">
              <div class="card-media">
                <div class="slider-track" style="transform:translateX(0%);">
                  ${slidesHtml}
                </div>
                ${totalSlides > 1 ? `
                <button class="slider-btn slider-prev" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
                <button class="slider-btn slider-next" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
                <div class="slider-dots">${dotsHtml}</div>
                ` : ''}
                <span class="card-badge ${badgeClass}">${typeLabel}</span>
              </div>
              <div class="card-body">
                <h3>${p.name}</h3>
                <div class="desc">${p.description}</div>
                <div class="card-meta">
                  <span class="${typeTag}">${typeLabel}</span>
                  <span>${p.status}</span>
                  <span>${p.date}</span>
                  ${p.impact ? `<span class="impact"><i class="fas fa-arrow-trend-up"></i> ${p.impact}</span>` : ''}
                </div>
                <a href="${p.link}" target="_blank" rel="noopener" class="card-link">
                  View project <i class="fas fa-arrow-right"></i>
                </a>
              </div>
            </div>
          `;
      });

      track.innerHTML = singleSetHtml + singleSetHtml;

      document.querySelectorAll('.project-card').forEach(card => initSlider(card));

      allCards = document.querySelectorAll('.project-card');
      totalCards = filtered.length;
      updateStats();

      requestAnimationFrame(() => {
        const firstCard = track.querySelector('.project-card');
        if (firstCard) {
          const cardWidth = firstCard.offsetWidth + 32;
          setWidth = totalCards * cardWidth;
        }
        progress = 0;
        rounds = 0;
        speed = fastSpeed;
        updateUI();
        setMotionMode(motionMode);
      });
    }


    // ================================================================
    // 5.  AUTO-SCROLL ENGINE
    // ================================================================
    let progress = 0;
    let rounds = 0;
    let speed = 0;
    const fastSpeed = 1.0;
    const slowSpeed = 0.2;
    let lastTime = 0;

    // Motion mode: 'all' = continuous auto-scroll through everything,
    // 'one' = step through projects one at a time.
    let motionMode = 'all';
    let oneByOneTimer = null;
    const ONE_BY_ONE_DELAY = 2400;

    const trackEl = document.getElementById('horizontalTrack');
    const progressBar = document.getElementById('scrollBar');
    const progressText = document.getElementById('progressText');

    function updateUI() {
      const pct = Math.round(progress * 100);
      progressBar.style.width = pct + '%';
      progressText.textContent = pct + '%';
      allCards.forEach((card, index) => {
        const waveY = Math.sin(index * 0.7 + progress * 12) * 18;
        const waveRot = Math.sin(index * 0.5 + progress * 8) * 2;
        card.style.transform = `translateY(${waveY}px) rotate(${waveRot}deg)`;
      });
    }

    function updateTrackPosition() {
      if (!trackEl || allCards.length === 0) return;
      const viewportWidth = window.innerWidth;
      const maxTranslate = Math.max(0, setWidth - viewportWidth + 40);
      const translateX = -progress * maxTranslate;
      trackEl.style.transform = `translateX(${translateX}px)`;
    }

    function stepOneByOne() {
      if (totalCards <= 0) return;
      progress += 1 / totalCards;
      if (progress >= 1) progress = 0;
      updateUI();
      updateTrackPosition();
    }

    function setMotionMode(mode) {
      motionMode = mode;
      document.getElementById('modeAllBtn').classList.toggle('active', mode === 'all');
      document.getElementById('modeOneBtn').classList.toggle('active', mode === 'one');

      if (oneByOneTimer) {
        clearInterval(oneByOneTimer);
        oneByOneTimer = null;
      }

      if (mode === 'one') {
        if (trackEl) trackEl.style.transitionDuration = '0.7s';
        oneByOneTimer = setInterval(stepOneByOne, ONE_BY_ONE_DELAY);
      } else {
        if (trackEl) trackEl.style.transitionDuration = '';
        speed = fastSpeed;
        rounds = 0;
      }
    }

    function loopStep(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      if (motionMode === 'all' && speed > 0 && setWidth > 0) {
        progress += speed * delta;
        if (progress >= 1.0) {
          progress = 0;
          rounds++;
          if (rounds >= 2 && speed === fastSpeed) {
            speed = slowSpeed;
          }
        }
        updateUI();
        updateTrackPosition();
      }
      requestAnimationFrame(loopStep);
    }
    requestAnimationFrame(loopStep);


    // ================================================================
    // 6.  CONTROLS
    // ================================================================
    document.getElementById('modeAllBtn').addEventListener('click', () => setMotionMode('all'));
    document.getElementById('modeOneBtn').addEventListener('click', () => setMotionMode('one'));


    // ================================================================
    // 7.  FILTER
    // ================================================================
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderProjects(this.dataset.filter);
        setTimeout(() => { updateUI(); updateTrackPosition(); }, 100);
      });
    });


    // ================================================================
    // 8.  LIGHTBOX
    // ================================================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('lightboxClose');

    document.addEventListener('click', (e) => {
      const img = e.target.closest('.slide img');
      if (img) {
        e.preventDefault();
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt || '';
        lightbox.classList.add('open');
        document.body.classList.add('lightbox-open');
      }
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.classList.remove('lightbox-open');
    }
    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });


    // ================================================================
    // 9.  STATS & INIT
    // ================================================================
    function updateStats() {
      document.getElementById('totalProjects').textContent = projectData.length;
    }

    window.addEventListener('resize', () => {
      if (setWidth > 0) updateTrackPosition();
    });

    loadProjectData();
  </script>
</body>
</html>
